<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>光合成 | AIこども英語教育 プロトタイプ</title>
<link rel="stylesheet" href="style.css" />
<style>
  .passage {
    text-align: left;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    line-height: 1.9;
    color: #3A3A3A;
    background: #F0FBFB;
    border: 2px solid #06AED5;
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 16px;
    max-height: 260px;
    overflow-y: auto;
  }
  .sentence {
    cursor: pointer;
    border-radius: 4px;
    padding: 1px 2px;
  }
  .sentence.active { background: #FFC43D; }
  .diagram-wrap { margin: 4px auto 18px; max-width: 320px; }
</style>
</head>
<body>

<div class="card" id="app">
  <div class="confetti-layer" id="confetti"></div>

  <div class="card-header">
    <span class="card-title">CLIL：光合成（応用）</span>
    <div class="stars" id="stars"></div>
  </div>

  <div class="phase fade-in" data-phase="reading">
    <p class="subtitle">文章を読んで、聞いてみよう</p>

    <div class="passage" id="passage"></div>

    <button id="playAllBtn" class="btn-outline-gold" style="margin-bottom:18px;">🔊 全文を聞く</button>

    <p class="subtitle" style="margin-bottom:8px;">図でしくみを見てみよう</p>
    <div class="diagram-wrap">
      <svg viewBox="0 0 340 260" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto;">
        <circle cx="48" cy="46" r="20" fill="#F2B705"/>
        <g stroke="#F2B705" stroke-width="3" stroke-linecap="round">
          <line x1="48" y1="14" x2="48" y2="4"/>
          <line x1="76" y1="28" x2="84" y2="21"/>
          <line x1="76" y1="64" x2="84" y2="71"/>
          <line x1="20" y1="28" x2="12" y2="21"/>
        </g>
        <rect x="90" y="220" width="160" height="26" fill="#B08968"/>
        <path d="M180 218 Q166 198 172 176 M180 218 Q194 198 189 178" stroke="#8A5A2B" stroke-width="3" fill="none" stroke-linecap="round"/>
        <rect x="176" y="140" width="8" height="78" fill="#4C7A3D"/>
        <path d="M182 140 C 138 137, 112 112, 115 84 C 138 94, 164 108, 182 140 Z" fill="#6FAE4A"/>
        <path d="M188 140 C 232 137, 258 112, 255 84 C 232 94, 206 108, 188 140 Z" fill="#7EC158"/>
        <line x1="64" y1="60" x2="120" y2="90" stroke="#F2B705" stroke-width="2" marker-end="url(#a1)"/>
        <line x1="320" y1="132" x2="248" y2="112" stroke="#8A8A8A" stroke-width="2" marker-end="url(#a2)"/>
        <line x1="110" y1="238" x2="176" y2="186" stroke="#3B8BD4" stroke-width="2" marker-end="url(#a3)"/>
        <line x1="200" y1="84" x2="250" y2="46" stroke="#1D9E75" stroke-width="2" marker-end="url(#a4)"/>
        <defs>
          <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#F2B705" stroke-width="1.5"/></marker>
          <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A8A8A" stroke-width="1.5"/></marker>
          <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3B8BD4" stroke-width="1.5"/></marker>
          <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5"/></marker>
        </defs>
        <text x="88" y="70" font-size="11" fill="#8A6D1B">sunlight</text>
        <text x="316" y="128" font-size="11" fill="#555555" text-anchor="end">CO2</text>
        <text x="106" y="252" font-size="11" fill="#1A5A90" text-anchor="end">water</text>
        <text x="252" y="42" font-size="11" fill="#0F6E56">oxygen</text>
      </svg>
    </div>

    <button id="toQuizBtn" class="btn-primary">つぎへ →</button>
  </div>

  <div class="phase fade-in hidden" data-phase="jp2en">
    <p class="subtitle">にほんごの ぶんに あうように、えいごの ことばを ならべよう</p>
    <div class="passage" id="jp2enPrompt" style="font-size:16px; text-align:center;"></div>
    <div id="jp2enBuilt" style="min-height:46px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-items:center; margin:14px 0; padding:10px 12px; background:#FFFDF7; border:2px dashed #E2DCCB; border-radius:16px;"></div>
    <div id="jp2enTray" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:16px;"></div>
    <div id="jp2enFeedback"></div>
  </div>

  <div class="phase fade-in hidden" data-phase="en2jp">
    <p class="subtitle">えいごの ぶんに あうように、にほんごの ことばを ならべよう</p>
    <div class="passage" id="en2jpPrompt" style="font-size:16px; text-align:center;"></div>
    <div id="en2jpBuilt" style="min-height:46px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-items:center; margin:14px 0; padding:10px 12px; background:#FFFDF7; border:2px dashed #E2DCCB; border-radius:16px;"></div>
    <div id="en2jpTray" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:16px;"></div>
    <div id="en2jpFeedback"></div>
  </div>

  <div class="phase fade-in hidden" data-phase="quiz">
    <p class="subtitle">What gas do plants release during photosynthesis?</p>

    <div id="options" style="display:flex; gap:14px; justify-content:center; margin-bottom:24px; flex-wrap:wrap;"></div>

    <div id="feedback"></div>
    <div id="quizActions"></div>
  </div>

  <div class="phase fade-in hidden" data-phase="done" style="padding-top:20px;">
    <div class="pulse-2x" style="font-size:64px; margin-bottom:12px;">🌱</div>
    <div class="done-title" style="color:#1D9E75;">サイエンスはかせ！</div>
    <div class="done-sub">光合成のしくみがわかったね</div>
    <div class="stars" id="starsDone" style="justify-content:center;"></div>
    <button id="restartBtn" class="btn-outline-teal" style="margin-top:26px;">もう一度あそぶ</button>
  </div>
</div>

<script src="common.js"></script>
<script src="clil-photosynthesis.js"></script>
</body>
</html>
