<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>センテンスリーディング | AIこども英語教育 プロトタイプ</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="card" id="app">
  <div class="confetti-layer" id="confetti"></div>

  <div class="card-header">
    <span class="card-title">センテンスリーディング</span>
    <div class="stars" id="stars"></div>
  </div>

  <!-- レッスンフェーズ -->
  <div class="phase fade-in" data-phase="lesson">
    <p class="subtitle"><ruby>単語<rt>たんご</rt></ruby>をタップして<ruby>読<rt>よ</rt></ruby>もう。<ruby>全部<rt>ぜんぶ</rt></ruby><ruby>読<rt>よ</rt></ruby>めたら<ruby>通<rt>とお</rt></ruby>して<ruby>聞<rt>き</rt></ruby>いてみよう</p>

    <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:14px;">
      <svg viewBox="0 0 120 100" width="104" height="87" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ship">
        <path d="M4 84 Q 19 74, 34 84 T 64 84 T 94 84 T 116 84" stroke="#06AED5" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M22 60 L98 60 L86 82 L34 82 Z" fill="#FF6B6B"/>
        <rect x="47" y="42" width="26" height="18" rx="3" fill="#FFFDF7" stroke="#22333B" stroke-width="2.5"/>
        <rect x="57" y="10" width="5" height="34" fill="#22333B"/>
        <path d="M62 12 L62 42 L38 37 Z" fill="#FFC43D"/>
        <path d="M62 10 L76 15 L62 20 Z" fill="#FF6B6B"/>
      </svg>
      <svg viewBox="0 0 110 20" width="110" height="20" xmlns="http://www.w3.org/2000/svg" style="margin-top:-2px;">
        <path d="M0 10 Q 14 2, 27 10 T 55 10 T 83 10 T 110 10" stroke="#06AED5" stroke-width="6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div id="wordRow" style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:24px; padding:18px 14px; background:#F0FBFB; border:2px solid #06AED5; border-radius:20px;"></div>

    <button id="playAllBtn" class="btn-outline-gold" style="margin-bottom:6px;">🔊 通して聞く</button>

    <button id="toQuizBtn" class="btn-primary" style="margin-top:24px;">クイズにチャレンジ →</button>
  </div>

  <!-- クイズフェーズ -->
  <div class="phase fade-in hidden" data-phase="quiz">
    <p class="subtitle"><ruby>正<rt>ただ</rt></ruby>しい<ruby>順番<rt>じゅんばん</rt></ruby>に<ruby>単語<rt>たんご</rt></ruby>をタップして<ruby>文<rt>ぶん</rt></ruby>を<ruby>完成<rt>かんせい</rt></ruby>させよう</p>

    <div id="builtRow" style="min-height:46px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-items:center; margin-bottom:18px; padding:10px 12px; background:#FFFDF7; border:2px dashed #E2DCCB; border-radius:16px;">
      <span id="builtPlaceholder" style="font-family:'Nunito',sans-serif; color:#B7AE9A; font-size:13px;">ここに単語が並びます</span>
    </div>

    <div id="scrambledRow" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:22px;"></div>

    <div id="feedback"></div>
    <div id="quizActions"></div>
  </div>

  <!-- 完了フェーズ -->
  <div class="phase fade-in hidden" data-phase="done" style="padding-top:40px;">
    <div class="pulse-2x" style="font-size:64px; margin-bottom:12px;">🎉</div>
    <div class="done-title" style="color:#FFC43D;"><ruby>次<rt>つぎ</rt></ruby>もがんばろう！</div>
    <div class="done-sub">"The shop sells fresh fish from the ship." を読めたね</div>
    <div class="stars" id="starsDone" style="justify-content:center;"></div>
    <button id="restartBtn" class="btn-outline-teal" style="margin-top:26px;">もう<ruby>一度<rt>いちど</rt></ruby><ruby>見<rt>み</rt></ruby>る</button>
  </div>
</div>

<script src="common.js"></script>
<script src="sentence-reading.js"></script>
</body>
</html>
